name: release

# Releases are built and published from a Mac with the Developer ID
# certificate (apple/scripts/release.sh): signed and notarized. This job is a
# by-hand fallback that only checks the build and keeps unsigned packages as
# workflow artifacts; it never publishes a release.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build and package (unsigned)
        run: apple/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wroopmark-mac
          path: dist/*
