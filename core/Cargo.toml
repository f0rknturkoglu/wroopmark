[package]
name = "wroopmark_core"
version = "0.1.0"
edition = "2024"
description = "wroopmark engine: platform extractors, SQLite/FTS5 library and a content-addressed media store"
license = "MIT"
publish = false

[lib]
# staticlib -> linked into the SwiftUI apps; rlib -> tests and the CLI.
crate-type = ["staticlib", "rlib"]

[[bin]]
# Also the Chromium native-messaging host (see src/bin/wroopmark.rs).
name = "wroopmark"
path = "src/bin/wroopmark.rs"

[dependencies]
# HTTP: blocking and tiny. native-tls uses Security.framework, so no TLS stack
# is compiled in and certificates come from the OS.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "gzip"] }
# Storage: bundled SQLite ships FTS5.
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.29", default-features = false }
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
# Panics are caught at the FFI boundary (ffi.rs), so unwinding must stay on.
panic = "unwind"
